spring:
  task.scheduling.pool.size: 2
  config:
    import: optional:file:.env.local[.properties]
  profiles.default: local
  application.name: wonderlife-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: tools_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: tools_spring_session
  security.oauth2.client.registration.google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    scope: openid,email
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/login/oauth2/code/google}
mybatis.configuration.map-underscore-to-camel-case: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet.session:
    timeout: 30d
    cookie.max-age: 30d
management.endpoints.web.exposure.include: health,info
app:
  education:
    batch-enabled: ${EDUCATION_BATCH_ENABLED:true}
    school-chunk: ${EDUCATION_SCHOOL_CHUNK:50}
    disclosure-chunk: ${EDUCATION_DISCLOSURE_CHUNK:30}
    chunk-delay-ms: ${EDUCATION_CHUNK_DELAY_MS:60000}
  cors.allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  price-collection:
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    job-token: ${PRICE_COLLECTION_JOB_TOKEN:}
    endpoint: https://apis.data.go.kr/B552845/recent/price
    page-size: 500
  price-lookup:
    period-endpoint: https://apis.data.go.kr/B552845/periodRetail/price
    region-endpoint: https://apis.data.go.kr/B552845/perRegion/price
  neis:
    api-key: ${NEIS_API_KEY:}
    endpoint: https://open.neis.go.kr/hub
  schoolinfo:
    api-key: ${SCHOOLINFO_API_KEY:}
    endpoint: https://www.schoolinfo.go.kr/openApi.do
